<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Glyph Studio</title>
    <link rel="icon" type="image/svg+xml" href="/resourses/Icons/glyph-logo.svg" />
    <script>
      (() => {
        // Preserve browser data when the application's storage namespace changes.
        try {
          const suffixes = ["uiTheme", "uiLanguage", "inspectorCollapsed", "leftPanelCollapsed", "templateTabs.v1"];
          const keys = Object.keys(localStorage);
          for (const suffix of suffixes) {
            const target = `glyphXml.${suffix}`;
            if (localStorage.getItem(target) !== null) continue;
            const previous = keys.find(key => key !== target && key.endsWith(`Xml.${suffix}`));
            if (previous) localStorage.setItem(target, localStorage.getItem(previous));
          }
        } catch {
          // Storage can be unavailable in restricted browser contexts.
        }
        const storageKey = "glyphXml.uiTheme";
        let preference = "system";
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch {
          // Use the system preference when storage is unavailable.
        }
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <link rel="preload" href="/resourses/Fonts/Geist.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
